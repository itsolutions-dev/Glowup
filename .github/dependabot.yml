# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # One entry covers every workspace: Dependabot reads the root package.json's
  # `workspaces` and the committed package-lock.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The Expo SDK pins these to one tested set (expo/bundledNativeModules.json).
      # They move together with the SDK, through `npx expo install --fix`, never
      # one at a time: a lone react-native or reanimated bump builds on no device.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "jest-expo"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@expo/*"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      # Majors are held back by the toolchain, not by choice: jest-expo depends
      # on jest 29, typescript-eslint supports TypeScript < 6.1, and
      # eslint-plugin-import / eslint-plugin-react do not support ESLint 10.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
