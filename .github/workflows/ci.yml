name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No committed lockfile in this repo (package-lock.json is gitignored), so npm
      # caching by lockfile hash is unavailable and we use `npm install` (not `npm ci`).
      # setup-node v5 auto-caches when package.json has a `packageManager` field, which
      # would need a lockfile to hash - keep it off explicitly.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (all workspaces)
        run: npm run type-check

      - name: Test (all workspaces)
        run: npm test

      - name: Build library
        run: npm run build

      - name: Lint
        run: npm run lint
