name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No committed lockfile in this repo (package-lock.json is gitignored), so npm
      # caching by lockfile hash is unavailable and we use `npm install` (not `npm ci`).
      # setup-node v5 auto-caches when package.json has a `packageManager` field, which
      # would need a lockfile to hash - keep it off explicitly.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (all workspaces)
        run: npm run type-check

      - name: Test (all workspaces)
        run: npm test

      - name: Build library
        run: npm run build

      # The playground consumes packages/ui/src, so nothing else in CI exercises
      # the artefact npm actually ships. publint checks the manifest and export
      # map against the packed files; attw resolves the shipped .d.ts the way a
      # consumer's tsc would (it is what caught the theme.json type import).
      - name: Validate published package
        run: npm run validate-package -w @its/glowup-ui

      - name: Lint
        run: npm run lint

      # The prop tables on the docs site are generated from the library's
      # TypeScript and committed. A prop added, renamed or re-defaulted without
      # regenerating them would ship a reference that disagrees with the code,
      # and nothing else in CI would notice.
      - name: Check the generated prop tables are current
        run: |
          npm run docgen -w @its/glowup-playground
          git diff --exit-code -- apps/playground/docgen/props.generated.json

      # The variant galleries are rewritten from .design-sync/previews and
      # committed. An edited preview that is not regenerated would leave the
      # site showing the previous demo.
      - name: Check the generated variant galleries are current
        run: |
          npm run variants -w @its/glowup-playground
          git diff --exit-code -- apps/playground/catalogue/variants/generated

      # The playground is published as a static site, so a change that only
      # breaks the web export (a module that reaches for `window` while
      # prerendering, a route that throws) has to fail here rather than in the
      # deploy workflow after merge.
      - name: Build the documentation site
        run: npm run export:web -w @its/glowup-playground
