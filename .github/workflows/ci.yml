name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # No committed lockfile in this repo, so use `npm install` (not `npm ci`).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (all workspaces)
        run: npm run type-check

      - name: Test (all workspaces)
        run: npm test

      - name: Build library
        run: npm run build

      # Lint is currently informational: the repo enforces CRLF line endings via ESLint
      # while the checked-in files use LF, so a repo-wide line-ending normalisation is
      # needed before lint can gate CI. Tracked as a follow-up.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
