name: Consumer smoke

# Validates the PUBLISHED package, not the working tree: examples/consumer is
# outside the npm workspaces and installs @its/glowup-ui from the registry. It
# therefore does not run on pull requests — a PR cannot change what is already
# published — and instead chains off Release.
#
# `workflow_run` fires after EVERY Release run, which means every push to master:
# Release runs whether or not there is anything to publish (with pending
# changesets it just refreshes the "Version Packages" PR). That cadence is
# deliberate — it means a just-published version is smoke-tested immediately —
# but do not read it as "only after a publish". A `push` trigger here would be
# pure duplication: it would fire on the same commit, one job earlier.
#
# The gap that leaves: if a Release run fails, the smoke test is skipped for that
# commit. Re-run it by hand with workflow_dispatch.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [master]

concurrency:
  group: consumer-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/consumer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # Smoke-test the version this commit says was released, not whatever a
      # range happens to resolve to. In 0.x a caret never crosses a minor
      # (`^0.5.0` stops at 0.5.x), so a range in package.json silently kept this
      # job testing an old release. On a master commit packages/ui's version is
      # the one Release just published (or the last one it did), so pinning to
      # it also turns a failed publish into a failure here instead of a pass
      # against a stale version.
      #
      # A just-published version can take a minute to show up in the packument
      # that `npm install` reads, even though its version document is already
      # served. Poll instead of losing the race with the Release run.
      - name: Wait for the released version to resolve on the registry
        id: version
        run: |
          version=$(node -p "require('../../packages/ui/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 20); do
            if npm view "@its/glowup-ui@$version" version; then exit 0; fi
            echo "not resolvable yet; retrying in 15s"
            sleep 15
          done
          echo "::error::@its/glowup-ui@$version never became resolvable"
          exit 1

      # No lockfile here on purpose (see examples/consumer/README.md): the point
      # is to resolve the published package and its peers the way a new app does.
      # `npm install <pkg>@<version>` installs the rest of package.json with it.
      - name: Install from the registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm install --no-audit --no-fund --no-save "@its/glowup-ui@$VERSION"

      - name: Refuse a workspace symlink
        run: |
          if [ -L node_modules/@its/glowup-ui ]; then
            echo "::error::node_modules/@its/glowup-ui is a symlink to the local package. This app must consume the published one — do not add examples/ to the npm workspaces."
            exit 1
          fi
          node -p "'consuming @its/glowup-ui@' + require('@its/glowup-ui/package.json').version"

      - name: Type-check against the published types
        run: npx tsc --noEmit

      - name: Bundle for web
        run: npx expo export -p web
