name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: `npm publish` trades this job's OIDC token for a
  # short-lived publish credential and attaches a provenance attestation. There
  # is no long-lived NPM_TOKEN to leak. It needs the trusted publisher set up
  # once on npmjs.com for EACH package (package → Settings → Trusted publishing →
  # GitHub Actions, repository itsolutions-dev/Glowup, workflow release.yml).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The job's write token must not sit in .git/config while ~1,400 packages
      # install and the library builds; changesets/action sets up its own git
      # credentials when it needs to push the "Version Packages" branch.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache on the job that publishes: it installs from the
      # lockfile every time rather than from anything another run left behind.
      # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build packages
        run: npm run build

      # Opens/updates a "Version Packages" PR from pending changesets; when that PR is
      # merged, `npm run release` (changeset publish) publishes @its/glowup-ui,
      # @its/glowup-notifications, @its/glowup-device and @its/rfid-honeywell to npm
      # (each only when its version is not there yet).
      # The version script also regenerates the prop tables, which record the
      # library version, so the PR does not fail CI's docgen diff check.
      #
      # TEMPORARY, until every package has its first version on npm: trusted
      # publishing cannot create a package (npm answers E404 on PUT), so a
      # granular token in the NPM_TOKEN secret publishes those first versions.
      # npm tries OIDC first and keeps the token only where the exchange fails,
      # so @its/glowup-ui still publishes through its trusted publisher, and
      # every package's publishConfig keeps the provenance attestation. Once the
      # trusted publishers exist, delete the secret and this line (without the
      # secret the variable is empty and publishing rests on OIDC alone, as before).
      - name: Create Release PR or publish
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
