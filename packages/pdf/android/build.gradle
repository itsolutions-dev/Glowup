plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'its.glowup.pdf'
version = '0.0.0'

expoModule {
  // Built from source with the app: there is no prebuilt copy to publish.
  canBePublished false
}

android {
  namespace "its.glowup.pdf"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
}
